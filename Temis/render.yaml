services:
  # 1. TEMIS Backend Service (FastAPI)
  - type: web
    name: temis-backend
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: temis-postgres-db
          property: connectionString

  # 2. TEMIS Web Flow Service (Reflex Full-Stack App)
  - type: web
    name: temis-web-flow
    env: python
    region: oregon
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m reflex init"
    startCommand: "python -m reflex run --env prod --frontend-port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: API_BASE_URL
        fromService:
          type: web
          name: temis-backend
          property: url

databases:
  # Managed PostgreSQL Database on Render
  - name: temis-postgres-db
    region: oregon
    plan: free
    databaseName: temis_db
    user: temis_user
